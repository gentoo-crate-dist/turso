
name: Create crate dist
on:
  push:
    tags:
      - '**'

jobs:
  crate-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create crate dist
        uses: projg2/crate-dist-action@v1
        with:
          directories: cli bindings/python extensions/completion simulator sdk-kit
          dist-filename: turso-0.4.4-pre.3-crates.tar.xz
          run-cargo-update: false

